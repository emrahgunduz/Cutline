name: Cutline
options:
  bundleIdPrefix: com.emrahgunduz
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
  configs:
    # Release is the day-to-day app: everything for speed, size doesn't matter.
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"            # speed (not -Osize)
      SWIFT_COMPILATION_MODE: wholemodule       # optimise across the whole app at once
      # Tune for Apple Silicon (M1 and later only): schedule and pick instructions for it.
      OTHER_SWIFT_FLAGS: "$(inherited) -target-cpu apple-m1"
      OTHER_CFLAGS: "$(inherited) -mcpu=apple-m1"
      GCC_OPTIMIZATION_LEVEL: "3"
      LLVM_LTO: YES_THIN
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: NO                    # no testability hooks blocking optimisations
      ENABLE_NS_ASSERTIONS: NO
      DEAD_CODE_STRIPPING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym # symbols stay in a separate dSYM, not the app
targets:
  Cutline:
    type: application
    platform: macOS
    sources:
      - Cutline
      # The pinned model list, shared with the helper (one source of truth).
      - path: helper/cutline_helper/models.json
        buildPhase: resources
    info:
      path: Cutline/Info.plist
      properties:
        CFBundleName: Cutline
        CFBundleDisplayName: Cutline
        # The build stamps 1.0.<build number> into the built app (scripts/stamp_version.sh).
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "0"
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "15.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cutline Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.emrahgunduz.cutline.project]
            LSTypeIsPackage: true
            CFBundleTypeIconFile: CutlineDocument
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ProjectDocument
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.emrahgunduz.cutline.project
            UTTypeDescription: Cutline Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeIconFile: CutlineDocument
            UTTypeTagSpecification:
              public.filename-extension: [cutline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emrahgunduz.cutline
        VERSION_BASE: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: cutline-ctl
        embed: false
    postBuildScripts:
      - name: Bundle cutline-ctl
        basedOnDependencyAnalysis: false
        script: |
          # The control channel's client, next to the app's executable (Contents/MacOS).
          cp "$BUILT_PRODUCTS_DIR/cutline-ctl" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/cutline-ctl"
      - name: Stamp version
        basedOnDependencyAnalysis: false
        # Depends on the processed Info.plist, so it always runs after Xcode writes it
        # (otherwise the two can race and the stamp is overwritten).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          "$SRCROOT/scripts/stamp_version.sh"
      - name: Bundle analysis runtime
        basedOnDependencyAnalysis: false
        script: |
          # Copies the Python runtime (build/ml/python, made by scripts/build_python_runtime.sh)
          # and the helper source into Contents/Resources/ml. The models are not bundled: the app
          # downloads them into a folder the user picks (ModelStore).
          SRC="$SRCROOT/build/ml"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ml"
          rm -rf "$DST/models"
          if [ ! -x "$SRC/python/bin/python3" ]; then
            echo "warning: build/ml/python is missing. Run scripts/build_python_runtime.sh; analysis is unavailable in this build."
            rm -rf "$DST"
            exit 0
          fi
          mkdir -p "$DST/helper"
          rsync -a --delete "$SRC/python/" "$DST/python/"
          rsync -a --delete --exclude __pycache__ "$SRCROOT/helper/cutline_helper/" "$DST/helper/cutline_helper/"
  cutline-ctl:
    # The control channel's command-line client (Claude runs it), shipped inside the app.
    type: tool
    platform: macOS
    sources:
      - Tools/cutline-ctl
      - Cutline/Control/ControlProtocol.swift
    settings:
      base:
        PRODUCT_NAME: cutline-ctl
        SKIP_INSTALL: YES
  CutlineTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CutlineTests]
    dependencies:
      - target: Cutline
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cutline.app/Contents/MacOS/Cutline
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cutline:
    build:
      targets:
        Cutline: all
        CutlineTests: [test]
    test:
      targets: [CutlineTests]
